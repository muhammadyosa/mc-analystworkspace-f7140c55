<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1220" />
    <title>MCA Workspace — Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        background: #0b1220;
        color: #e2e8f0;
        font-family: system-ui, -apple-system, sans-serif;
        text-align: center;
        padding: 2rem;
      }
      h1 { font-size: 1.4rem; margin: 0 0 0.5rem; }
      p { color: #94a3b8; margin: 0 0 1.5rem; }
      button {
        background: #22d3ee;
        color: #0b1220;
        border: 0;
        border-radius: 999px;
        padding: 0.75rem 1.75rem;
        font-weight: 600;
        font-size: 1rem;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div>
      <h1>Kamu sedang offline</h1>
      <p>MCA Workspace membutuhkan koneksi internet untuk memuat data terbaru.</p>
      <button onclick="location.reload()">Coba Lagi</button>
    </div>
  </body>
</html>
